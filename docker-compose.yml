services:
  postgres:
    image: postgres:16-alpine
    container_name: fystrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fystrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fystrm}
      POSTGRES_DB: ${POSTGRES_DB:-fystrm}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"   # 仅本机
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fystrm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fystrm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:16379:6379"   # 仅本机
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fystrm:0.1.0
    container_name: fystrm-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./scan-source:/scan-source:ro
      - ./media:/media
      - ./data/config:/config
    ports:
      - "0.0.0.0:8095:8095"      # 公网开放
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8095/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: fystrm:0.1.0
    container_name: fystrm-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./scan-source:/scan-source:ro
      - ./media:/media
      - ./data/config:/config
    command: ["arq", "fystrm.tasks.worker.WorkerSettings"]
    healthcheck:
      disable: true

networks:
  default:
    name: fystrm-net
